services:
  - type: web
    name: typeform-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && cd myproject && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd myproject && gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: typeform-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-vercel-app.vercel.app"  # UPDATE after Vercel deploy

databases:
  - name: typeform-db
    databaseName: typeform
    user: typeform
